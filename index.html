<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>照見映像工作室 — 線上預約</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600&family=Noto+Sans+TC:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sky: #C8DCE8;
    --sky-light: #E0EEF5;
    --sky-pale: #F0F7FB;
    --sky-deep: #8AAFC4;
    --cream: #FAF7F2;
    --cream-warm: #F3EDE4;
    --ink: #1E2A35;
    --ink-soft: #3D5060;
    --ink-muted: #7A8F9E;
    --white: #FFFFFF;
    --border: rgba(30,42,53,0.1);
    --border-soft: rgba(30,42,53,0.06);
  }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--cream);
    color: var(--ink);
    min-height: 100vh;
    line-height: 1.7;
  }

  /* Header */
  header {
    background: linear-gradient(160deg, #1E2A35 0%, #2C3E50 100%);
    padding: 2.5rem 2rem 2rem;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(200,220,232,0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(200,220,232,0.06) 0%, transparent 50%);
  }
  header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(200,220,232,0.4), transparent);
  }
  .header-inner { position: relative; }
  .studio-en {
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px;
    font-weight: 300;
    color: var(--sky);
    letter-spacing: 0.35em;
    text-transform: uppercase;
    margin-bottom: 10px;
    opacity: 0.8;
  }
  .studio-name {
    font-family: 'Noto Serif TC', serif;
    font-size: clamp(24px, 4vw, 34px);
    font-weight: 400;
    color: var(--white);
    letter-spacing: 0.18em;
    margin-bottom: 6px;
  }
  .studio-name span {
    color: var(--sky-light);
  }
  .header-deco {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin: 14px 0 6px;
  }
  .header-deco-line {
    width: 48px; height: 0.5px;
    background: linear-gradient(90deg, transparent, var(--sky-deep));
  }
  .header-deco-line.right {
    background: linear-gradient(90deg, var(--sky-deep), transparent);
  }
  .header-deco-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--sky);
    opacity: 0.6;
  }
  .studio-tagline {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 14px;
    color: rgba(200,220,232,0.55);
    letter-spacing: 0.1em;
  }

  /* Main */
  main { max-width: 720px; margin: 0 auto; padding: 2rem 1.25rem 5rem; }

  /* Info chips */
  .info-bar { display: flex; gap: 10px; margin-bottom: 2rem; flex-wrap: wrap; }
  .info-chip {
    background: var(--white);
    border: 0.5px solid var(--border);
    border-radius: 100px;
    padding: 5px 14px;
    font-size: 12px;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 1px 3px rgba(30,42,53,0.05);
  }
  .info-chip-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--sky-deep);
    flex-shrink: 0;
  }

  /* Section */
  .section { margin-bottom: 1.25rem; }
  .section-title {
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin-bottom: 10px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-title::after {
    content: '';
    flex: 1;
    height: 0.5px;
    background: var(--border);
  }

  /* Card */
  .card {
    background: var(--white);
    border: 0.5px solid var(--border);
    border-radius: 18px;
    padding: 1.5rem;
    box-shadow: 0 2px 12px rgba(30,42,53,0.05);
  }

  /* Date buttons */
  .date-scroll { display: flex; gap: 8px; flex-wrap: wrap; }
  .date-btn {
    padding: 7px 15px;
    border: 0.5px solid var(--border);
    border-radius: 100px;
    background: transparent;
    color: var(--ink-soft);
    font-size: 13px;
    font-family: 'Noto Sans TC', sans-serif;
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
  }
  .date-btn:hover:not(.active) { border-color: var(--sky-deep); color: var(--sky-deep); background: var(--sky-pale); }
  .date-btn.active { background: var(--ink); color: var(--sky-light); border-color: var(--ink); }

  /* Slots */
  .divider { height: 0.5px; background: var(--border-soft); margin: 1.25rem 0; }
  .slots-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .slot {
    padding: 9px 4px;
    border: 0.5px solid var(--border);
    border-radius: 10px;
    text-align: center;
    font-size: 13px;
    cursor: pointer;
    color: var(--ink);
    background: var(--white);
    font-family: 'Noto Sans TC', sans-serif;
    transition: all 0.15s ease;
  }
  .slot:hover:not(.taken):not(.selected):not(.loading) { border-color: var(--sky-deep); color: var(--sky-deep); background: var(--sky-pale); }
  .slot.selected { background: var(--ink); color: var(--sky-light); border-color: var(--ink); font-weight: 500; }
  .slot.taken { background: var(--cream); color: var(--ink-muted); cursor: not-allowed; text-decoration: line-through; border-color: var(--border-soft); }
  .slot.loading { background: var(--cream); color: var(--ink-muted); cursor: wait; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .legend { display: flex; gap: 16px; margin-top: 12px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-muted); }
  .legend-dot { width: 10px; height: 10px; border-radius: 3px; }

  /* Summary */
  .selection-summary {
    background: var(--sky-pale);
    border: 0.5px solid rgba(138,175,196,0.35);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 1.25rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .selection-summary-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--sky-deep); flex-shrink: 0; }

  /* Form */
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--ink-muted); margin-bottom: 5px; letter-spacing: 0.05em; }
  .required { color: var(--sky-deep); margin-left: 2px; }
  .field input, .field textarea {
    width: 100%;
    padding: 9px 12px;
    border: 0.5px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    font-family: 'Noto Sans TC', sans-serif;
    color: var(--ink);
    background: var(--white);
    transition: border-color 0.15s;
    outline: none;
  }
  .field input:focus, .field textarea:focus { border-color: var(--sky-deep); box-shadow: 0 0 0 3px rgba(138,175,196,0.15); }
  .field textarea { resize: vertical; min-height: 80px; }

  /* Deposit note */
  .deposit-note {
    background: var(--sky-pale);
    border-left: 2px solid var(--sky-deep);
    border-radius: 0 10px 10px 0;
    padding: 10px 14px;
    font-size: 13px;
    color: var(--ink-soft);
    margin: 1.25rem 0;
    display: flex;
    align-items: flex-start;
    gap: 8px;
    line-height: 1.6;
  }

  /* Submit */
  .submit-btn {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, #1E2A35 0%, #2C3E50 100%);
    color: var(--sky-light);
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-family: 'Noto Serif TC', serif;
    letter-spacing: 0.12em;
    cursor: pointer;
    transition: opacity 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .submit-btn:hover:not(:disabled) { opacity: 0.88; }
  .submit-btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .spinner { width: 16px; height: 16px; border: 2px solid rgba(200,220,232,0.3); border-top-color: var(--sky-light); border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error-msg { background: #FEF0F0; border: 0.5px solid rgba(200,60,60,0.2); border-radius: 10px; padding: 10px 14px; font-size: 13px; color: #9B2020; margin-bottom: 12px; display: none; }

  /* Confirm */
  .confirm-wrap { text-align: center; padding: 1rem 0.5rem; }
  .confirm-icon {
    width: 68px; height: 68px;
    background: linear-gradient(135deg, #1E2A35, #2C3E50);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 1.25rem;
    box-shadow: 0 4px 16px rgba(30,42,53,0.2);
  }
  .confirm-icon svg { width: 28px; height: 28px; stroke: var(--sky-light); fill: none; stroke-width: 1.5; }
  .confirm-title { font-family: 'Noto Serif TC', serif; font-size: 22px; font-weight: 400; color: var(--ink); margin-bottom: 6px; letter-spacing: 0.08em; }
  .confirm-sub { font-size: 13px; color: var(--ink-muted); margin-bottom: 1.5rem; }
  .confirm-detail { background: var(--sky-pale); border: 0.5px solid rgba(138,175,196,0.3); border-radius: 14px; padding: 1.25rem; text-align: left; margin-bottom: 1.5rem; }
  .confirm-row { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0; border-bottom: 0.5px solid rgba(138,175,196,0.2); font-size: 14px; }
  .confirm-row:last-child { border-bottom: none; padding-bottom: 0; }
  .confirm-row-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--sky-deep); flex-shrink: 0; margin-top: 6px; }
  .confirm-row-label { font-size: 11px; color: var(--ink-muted); margin-bottom: 2px; }
  .confirm-row-value { color: var(--ink); }
  .reset-btn { padding: 10px 28px; border: 0.5px solid var(--border); border-radius: 100px; background: transparent; color: var(--ink-soft); font-size: 13px; font-family: 'Noto Sans TC', sans-serif; cursor: pointer; transition: all 0.15s; }
  .reset-btn:hover { border-color: var(--sky-deep); color: var(--sky-deep); background: var(--sky-pale); }

  /* Footer */
  footer { text-align: center; padding: 2rem; font-size: 11px; color: var(--ink-muted); letter-spacing: 0.1em; }

  @media (max-width: 480px) {
    .slots-grid { grid-template-columns: repeat(3, 1fr); }
    .card { padding: 1.25rem 1rem; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="studio-en">zhaojian.latelier</div>
    <div class="studio-name">照見<span>映像</span>工作室</div>
    <div class="header-deco">
      <div class="header-deco-line"></div>
      <div class="header-deco-dot"></div>
      <div class="header-deco-dot" style="opacity:0.35;"></div>
      <div class="header-deco-dot"></div>
      <div class="header-deco-line right"></div>
    </div>
    <div class="studio-tagline">Online Booking · 線上預約</div>
  </div>
</header>

<main>
  <div class="info-bar">
    <div class="info-chip"><div class="info-chip-dot"></div>週一至週六　09:00 – 17:00</div>
    <div class="info-chip"><div class="info-chip-dot"></div>一位攝影師　每節 30 分鐘</div>
    <div class="info-chip"><div class="info-chip-dot"></div>訂金到場現付</div>
  </div>

  <div id="booking-view">
    <div class="section">
      <div class="section-title">選擇日期與時段</div>
      <div class="card">
        <div class="date-scroll" id="date-row"></div>
        <div class="divider"></div>
        <div class="slots-grid" id="slots-grid"></div>
        <div class="legend">
          <div class="legend-item"><div class="legend-dot" style="background:var(--ink);"></div>已選取</div>
          <div class="legend-item"><div class="legend-dot" style="background:var(--cream);border:1px solid var(--border);"></div>已預約</div>
          <div class="legend-item"><div class="legend-dot" style="background:var(--white);border:1px solid var(--border);"></div>可預約</div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">填寫預約資料</div>
      <div class="card">
        <div class="selection-summary">
          <div class="selection-summary-dot"></div>
          <span id="summary-text">尚未選擇時段，請先於上方選取日期與時段</span>
        </div>
        <div class="error-msg" id="error-msg"></div>
        <div class="field"><label>姓名<span class="required">*</span></label><input type="text" id="f-name" placeholder="請輸入您的姓名"></div>
        <div class="field"><label>電子郵件<span class="required">*</span></label><input type="email" id="f-email" placeholder="請輸入您的 Email"></div>
        <div class="field"><label>聯絡電話<span class="required">*</span></label><input type="tel" id="f-phone" placeholder="09xx-xxx-xxx"></div>
        <div class="field"><label>拍攝需求說明</label><textarea id="f-note" placeholder="例如：個人寫真、畢業照、婚紗外拍…請描述您的期望風格或需求"></textarea></div>
        <div class="deposit-note">
          <div class="selection-summary-dot" style="margin-top:6px;flex-shrink:0;"></div>
          <span>訂金請於拍攝當天到場時以現金繳付，工作人員將協助確認並開立收據。</span>
        </div>
        <button class="submit-btn" id="submit-btn" onclick="handleSubmit()">確認預約</button>
      </div>
    </div>
  </div>

  <div id="confirm-view" style="display:none;">
    <div class="section">
      <div class="section-title">預約確認</div>
      <div class="card">
        <div class="confirm-wrap">
          <div class="confirm-icon">
            <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <div class="confirm-title">預約成功</div>
          <div class="confirm-sub">感謝您預約照見映像工作室，我們期待與您相見。</div>
          <div class="confirm-detail" id="confirm-detail"></div>
          <p style="font-size:12px;color:var(--ink-muted);margin-bottom:20px;">如需修改或取消，請提前 24 小時與我們聯絡。</p>
          <button class="reset-btn" onclick="resetAll()">預約另一個時段</button>
        </div>
      </div>
    </div>
  </div>
</main>

<footer>照見映像工作室 zhaojian.latelier · 版權所有</footer>

<script>
  const API_BASE = 'https://studio-v2-ten.vercel.app';

  const allSlots = [];
  for (let h = 9; h < 17; h++) { allSlots.push(pad(h)+':00'); allSlots.push(pad(h)+':30'); }

  let selectedDate = 0;
  let selectedSlot = null;
  let takenTimes = [];

  function pad(n) { return n < 10 ? '0'+n : ''+n; }

  function getDates() {
    const result = [], today = new Date();
    for (let i = 1; result.length < 5; i++) {
      const d = new Date(today); d.setDate(today.getDate()+i);
      if (d.getDay() !== 0) result.push(d);
    }
    return result;
  }
  const dates = getDates();

  function formatShort(d) {
    const days = ['日','一','二','三','四','五','六'];
    return (d.getMonth()+1)+'/'+d.getDate()+'（週'+days[d.getDay()]+'）';
  }
  function formatFull(d) {
    return d.getFullYear()+' 年 '+(d.getMonth()+1)+' 月 '+d.getDate()+' 日';
  }
  function toDateStr(d) {
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  }
  function endTime(s) {
    const [h,m] = s.split(':').map(Number), t = h*60+m+30;
    return pad(Math.floor(t/60))+':'+pad(t%60);
  }

  async function fetchTakenSlots(dateStr) {
    try {
      const res = await fetch(`${API_BASE}/api/slots?date=${dateStr}`);
      const data = await res.json();
      return data.takenTimes || [];
    } catch { return []; }
  }

  function renderDates() {
    const row = document.getElementById('date-row');
    row.innerHTML = '';
    dates.forEach((d, i) => {
      const btn = document.createElement('button');
      btn.className = 'date-btn'+(i===selectedDate?' active':'');
      btn.textContent = formatShort(d);
      btn.onclick = async () => {
        selectedDate = i; selectedSlot = null;
        renderDates(); renderSlotsLoading(); updateSummary();
        takenTimes = await fetchTakenSlots(toDateStr(dates[i]));
        renderSlots();
      };
      row.appendChild(btn);
    });
  }

  function renderSlotsLoading() {
    const grid = document.getElementById('slots-grid');
    grid.innerHTML = '';
    allSlots.forEach(s => {
      const div = document.createElement('div');
      div.className = 'slot loading'; div.textContent = s;
      grid.appendChild(div);
    });
  }

  function renderSlots() {
    const grid = document.getElementById('slots-grid');
    grid.innerHTML = '';
    allSlots.forEach(s => {
      const isTaken = takenTimes.includes(s);
      const isSelected = selectedSlot === s;
      const div = document.createElement('div');
      div.className = 'slot'+(isTaken?' taken':'')+(isSelected?' selected':'');
      div.textContent = s;
      if (!isTaken) div.onclick = () => { selectedSlot = s; renderSlots(); updateSummary(); };
      grid.appendChild(div);
    });
  }

  function updateSummary() {
    const el = document.getElementById('summary-text');
    if (selectedSlot) {
      const d = dates[selectedDate];
      el.innerHTML = '<strong>'+formatFull(d)+'　'+selectedSlot+' – '+endTime(selectedSlot)+'</strong>';
    } else {
      el.textContent = '尚未選擇時段，請先於上方選取日期與時段';
    }
  }

  function showError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = msg; el.style.display = 'block';
    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  function hideError() { document.getElementById('error-msg').style.display = 'none'; }

  async function handleSubmit() {
    hideError();
    if (!selectedSlot) { showError('請先選擇預約時段'); return; }
    const name = document.getElementById('f-name').value.trim();
    const email = document.getElementById('f-email').value.trim();
    const phone = document.getElementById('f-phone').value.trim();
    const note = document.getElementById('f-note').value.trim();
    if (!name || !email || !phone) { showError('請填寫所有必填欄位（姓名、電子郵件、聯絡電話）'); return; }

    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner"></div> 送出中…';

    const d = dates[selectedDate];
    try {
      const res = await fetch(`${API_BASE}/api/booking`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, phone, note, date: toDateStr(d), time: selectedSlot, timeEnd: endTime(selectedSlot) }),
      });
      const data = await res.json();
      if (!res.ok) { showError(data.error || '預約失敗，請稍後再試'); btn.disabled=false; btn.innerHTML='確認預約'; return; }

      document.getElementById('confirm-detail').innerHTML =
        dRow('預約日期', formatFull(d)) +
        dRow('預約時段', selectedSlot+' – '+endTime(selectedSlot)) +
        dRow('預約姓名', name) +
        dRow('電子郵件', email) +
        dRow('聯絡電話', phone) +
        (note ? dRow('拍攝需求', note) : '') +
        dRow('訂金說明', '到場現付，工作人員將協助確認');

      document.getElementById('booking-view').style.display = 'none';
      document.getElementById('confirm-view').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch {
      showError('網路錯誤，請確認連線後再試');
      btn.disabled = false; btn.innerHTML = '確認預約';
    }
  }

  function dRow(label, value) {
    return `<div class="confirm-row"><div class="confirm-row-dot"></div><div><div class="confirm-row-label">${label}</div><div class="confirm-row-value">${value}</div></div></div>`;
  }

  function resetAll() {
    selectedSlot = null;
    ['f-name','f-email','f-phone','f-note'].forEach(id => document.getElementById(id).value='');
    document.getElementById('booking-view').style.display='block';
    document.getElementById('confirm-view').style.display='none';
    updateSummary(); renderSlots(); hideError();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  (async () => {
    renderDates(); renderSlotsLoading(); updateSummary();
    takenTimes = await fetchTakenSlots(toDateStr(dates[0]));
    renderSlots();
  })();
</script>
</body>
</html>
